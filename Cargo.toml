[workspace]
resolver = "2"
members = ["crates/loopwebm-core", "crates/loopwebm-cli", "crates/loopwebm-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
loopwebm-core = { path = "crates/loopwebm-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Pixel loops are hot even in debug/test builds.
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1

[package]
name = "loopwebm-cli"
description = "Command-line tool: turn an image into a seamless scrolling WebM loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loopwebm"
path = "src/main.rs"

[dependencies]
loopwebm-core.workspace = true
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"
ctrlc = "3.4"
